<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<title>임대지기</title>
<meta name="theme-color" content="#1F3A4D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#EAEEF2; --line:#D7DEE5;
  --text:#18242E; --muted:#5E6E7C; --faint:#8C9AA6;
  --primary:#1F3A4D; --primary-ink:#FFFFFF; --primary-soft:#E3ECF3;
  --accent:#B8852F; --accent-soft:#F6EEDD;
  --ok:#1F8A5B; --ok-soft:#DFF3E8; --warn:#C4841C; --warn-soft:#FBEFD6; --bad:#C43D3D; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(20,35,50,.06),0 6px 20px rgba(20,35,50,.06);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D; --surface:#172129; --surface2:#1F2B35; --line:#2B3843;
    --text:#E7EDF2; --muted:#A3B1BC; --faint:#6F7E8A;
    --primary:#8FB6D1; --primary-ink:#0E161D; --primary-soft:#1B2E3D;
    --accent:#D9A94E; --accent-soft:#33291A;
    --ok:#4CC08A; --ok-soft:#173226; --warn:#E2A84A; --warn-soft:#33281A; --bad:#EF6B6B; --bad-soft:#3A1E1E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161D; --surface:#172129; --surface2:#1F2B35; --line:#2B3843;
  --text:#E7EDF2; --muted:#A3B1BC; --faint:#6F7E8A;
  --primary:#8FB6D1; --primary-ink:#0E161D; --primary-soft:#1B2E3D;
  --accent:#D9A94E; --accent-soft:#33291A;
  --ok:#4CC08A; --ok-soft:#173226; --warn:#E2A84A; --warn-soft:#33281A; --bad:#EF6B6B; --bad-soft:#3A1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.num{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;letter-spacing:.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
header.top{position:sticky;top:0;z-index:20;background:var(--primary);color:var(--primary-ink);padding:12px 16px;display:flex;align-items:center;gap:10px}
header.top .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:700;color:#1B1408;font-size:15px;letter-spacing:-.02em}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em;flex:1}
header.top .sub{font-size:11.5px;opacity:.75;display:block;font-weight:400}
.iconbtn{background:transparent;border:0;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;right:4px;background:var(--bad);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:600}
main{flex:1;padding:14px 14px 96px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:transparent;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);cursor:pointer;position:relative}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--primary);font-weight:600}
nav.tabs .dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:4px;background:var(--bad)}
h2.sec{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:22px 2px 8px}
h2.sec:first-child{margin-top:4px}
h2.sec .r{float:right;font-weight:500;text-transform:none;letter-spacing:0;color:var(--primary);cursor:pointer;background:none;border:0;font-size:12.5px;padding:0}
.card{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.card h3{margin:0 0 4px;font-size:15.5px;font-weight:600}
.card .meta{font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);vertical-align:middle;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.pri{background:var(--primary-soft);color:var(--primary)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.p:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)} .btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent} .btn.acc{background:var(--accent);color:#1B1408;border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px} .btn.w{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.item .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:16px;font-weight:700}
.item .ic.due{background:var(--warn-soft);color:var(--warn)} .item .ic.bad{background:var(--bad-soft);color:var(--bad)} .item .ic.exp{background:var(--primary-soft);color:var(--primary)} .item .ic.inv{background:var(--accent-soft);color:var(--accent)} .item .ic.ok{background:var(--ok-soft);color:var(--ok)}
.item .b{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px}
.item .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
canvas.chart{width:100%;height:190px;display:block;margin-top:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.03em;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tb td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb td.r,table.tb th.r{text-align:right}
table.tb th,table.tb td.num{white-space:nowrap}
.tbwrap{overflow-x:auto}
.empty{text-align:center;color:var(--faint);padding:28px 10px;font-size:13.5px}
.banner{background:var(--accent-soft);color:var(--text);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.banner b{color:var(--accent);white-space:nowrap}
.banner button{margin-left:auto}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.note.law{border-left:3px solid var(--accent);padding-left:10px}
.fab{position:fixed;right:calc(50% - 240px + 16px);bottom:78px;z-index:19;background:var(--accent);color:#1B1408;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;font-size:14px}
@media (max-width:480px){.fab{right:16px}}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(10,20,30,.45)}
#modal.open{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:480px;max-height:92dvh;border-radius:18px 18px 0 0;overflow:auto;padding:8px 16px 24px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#modal .sheet{animation:none}}
#modal .grip{width:44px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
#modal h2{font-size:18px;margin:6px 0 12px;font-weight:600}
.timeline{position:relative;padding-left:22px;margin-top:8px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:5px 0 9px;font-size:13px}
.tl:before{content:"";position:absolute;left:-19px;top:10px;width:10px;height:10px;border-radius:5px;background:var(--surface);border:2px solid var(--faint)}
.tl.past:before{background:var(--faint)} .tl.now:before{border-color:var(--accent);background:var(--accent)} .tl.key:before{border-color:var(--primary)}
.tl .dt{color:var(--muted);font-size:12px}
.msg{max-width:84%;padding:9px 12px;border-radius:14px;font-size:13.5px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.msg.out{background:var(--primary);color:var(--primary-ink);margin-left:auto;border-bottom-right-radius:4px}
.msg.in{background:var(--surface);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg .at{display:block;font-size:10.5px;opacity:.7;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.check:first-child{border-top:0}
.check .m{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.check .m.ok{background:var(--ok-soft);color:var(--ok)} .check .m.warn{background:var(--warn-soft);color:var(--warn)} .check .m.bad{background:var(--bad-soft);color:var(--bad)}
.invoice{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-size:13px}
.invoice .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.invoice .hd b{font-size:14.5px}
.invoice dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0}
.invoice dt{color:var(--muted)} .invoice dd{margin:0;text-align:right}
.invoice .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-weight:600}
.seal{width:44px;height:44px;border-radius:22px;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;transform:rotate(-12deg);line-height:1.1;text-align:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.tw{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tw input{width:auto;margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.mini .l{font-size:11px;color:var(--muted)} .mini .v{font-weight:600;font-size:14px;margin-top:2px}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--accent);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
details.acc{border-top:1px solid var(--line);padding:8px 0}
details.acc summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.acc summary:after{content:"+";color:var(--faint)} details.acc[open] summary:after{content:"–"}
.sub-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sub-h h2{margin:0;font-size:18px;font-weight:600;flex:1}
.back{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow);font-size:18px}
/* 로그인 */
#login{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#login.open{display:flex}
#login .box{width:100%;max-width:380px}
#login .logo{width:64px;height:64px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-weight:700;color:#1B1408;font-size:24px;margin:0 auto 12px}
#login h1{text-align:center;font-size:22px;margin:0 0 4px}
#login .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:22px}
#login .card{padding:18px 16px}
#login .kakao{background:#FEE500;color:#191919;border:0;font-weight:600}
#login .msg{min-height:20px;font-size:13px;color:var(--bad);text-align:center;margin-top:8px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--faint);margin-left:6px;vertical-align:middle}
.syncdot.ok{background:var(--ok)} .syncdot.busy{background:var(--warn)} .syncdot.err{background:var(--bad)}
/* 계약서 사진 */
.pstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pth{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.pth img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pth button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.pview{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column}
.pv-top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:14px}
.pv-top button,.pv-nav button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer}
.pv-body{flex:1;overflow:auto;touch-action:pinch-zoom;display:flex;align-items:flex-start;justify-content:center}
.pv-body img{max-width:100%;height:auto;display:block}
.pv-nav{display:flex;gap:10px;justify-content:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="login" role="dialog" aria-modal="true"><div class="box">
  <div class="logo">지기</div><h1>임대지기</h1><div class="sub">임대현황 · 임대료 · 세금계산서를 한 곳에서</div>
  <div class="card">
    <div id="loginKakao" hidden><button class="btn kakao w" type="button" onclick="authKakao()">카카오로 시작하기</button><div class="meta" style="text-align:center;margin:10px 0">또는 이메일로</div></div>
    <label class="f">이메일</label><input id="l_email" type="email" autocomplete="username" placeholder="name@example.com">
    <label class="f">비밀번호 (6자 이상)</label><input id="l_pw" type="password" autocomplete="current-password" placeholder="••••••">
    <div class="row2" style="margin-top:14px"><button class="btn p" type="button" onclick="authEmail('in')">로그인</button><button class="btn" type="button" onclick="authEmail('up')">회원가입</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>
  <div class="note" style="text-align:center;margin-top:14px">로그인하면 임대현황이 회사 서버(서울)에 안전하게 저장되어 폰을 바꿔도 이어서 쓸 수 있습니다.</div>
</div></div>
<div id="app">
  <header class="top">
    <div class="logo">지기</div>
    <h1>임대지기<span class="sub" id="hdrSub">임대현황 · 임대료 · 세금계산서를 한 곳에서</span></h1>
    <button class="iconbtn" id="bellBtn" aria-label="알림" title="알림">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge" id="bellBadge" hidden>0</span>
    </button>
    <button class="iconbtn" id="gearBtn" aria-label="설정" title="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">

/* ================= 임대지기 — 임대인용 임대현황 관리 앱 (프로토타입) ================= */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n==null||isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR') + '원';
const manwon = n => (n==null||isNaN(n)) ? '-' : (Math.round(n/10000)).toLocaleString('ko-KR') + '만원';
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d,n) => { const x = new Date(d); x.setMonth(x.getMonth()+n); return x; };
const daysBetween = (a,b) => Math.round((parseD(ymd(b)) - parseD(ymd(a)))/86400000);
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmtD = s => { if(!s) return '-'; const d = typeof s==='string'?parseD(s):s; return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const fmtYM = ym => { const [y,m]=ym.split('-'); return `${y}년 ${Number(m)}월`; };
const uid = () => Math.random().toString(36).slice(2,9);
const nowStr = () => { const d=new Date(); return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const TYPES = { shop:'상가', office:'사무실', house:'주택', land:'토지', etc:'기타' };
const TAXABLE = t => t !== 'house';   // 주택임대용역: 부가가치세 면세(부가가치세법 §26①12) → 세금계산서 발급 대상 아님

      { id:'c2', name:'역삼 오피스 5층', type:'office', addr:'서울 강남구 역삼로 45, 5층', area:98, tenant:'박서준', tenantPhone:'010-5555-1212', tenantBiz:'314-86-00999', tenantBizName:'서준소프트(주)', deposit:80000000, rent:4500000, mgmt:450000, vatSeparate:true, payDay:5, start:`${y-2}-11-01`, end:`${y}-10-31`, memo:'', review:null, quotes:[] },
      { id:'c3', name:'잠실 아파트 12층', type:'house', addr:'서울 송파구 올림픽로 300, 1203호', area:84.9, tenant:'이지은', tenantPhone:'010-7777-8888', tenantBiz:'', tenantBizName:'', deposit:300000000, rent:900000, mgmt:0, vatSeparate:false, payDay:10, start:`${y-1}-03-15`, end:`${y+1}-03-14`, memo:'주택임대차 신고 완료(확정일자 부여)', review:null, quotes:[] }

function seedDemoRents(st){
  // 예시: 지난 달까지 대부분 입금, 일부 지연/미납으로 표시

  st.contracts.forEach(c => {

      const late = (c.id==='c1' && idx === arr.length-3);
      st.rents[k] = { status:'paid', paidAt: ymd(new Date(d.getFullYear(), d.getMonth(), Math.min(c.payDay + (late?6:0), 28))), amount: c.rent };
      if (TAXABLE(c.type)) st.invoices[k] = { issued:true, issuedAt: ymd(new Date(d.getFullYear(), d.getMonth(), Math.min(c.payDay,28))), no:`${ym.replace('-','')}-41000000-${c.id.toUpperCase()}01` };
    });
  });
  // 지난달: c2(5일 납부)는 미입금 상태로 남겨 '재확인 알림 + 임차인 안내' 시나리오 제공
  st.rents[`c2_${prevYM}`] = { status:'unpaid', remindAt: ymd(t), reminders:1, amount:4500000 };
  delete st.invoices[`c2_${prevYM}`];
  st.threads = [

    { id:'t2', kind:'broker', name:'테헤란로 공인중개사사무소', phone:'010-2222-3333', contractId:'', messages:[{dir:'out', text:'테헤란로 123 1층 상가(42.5㎡) 최근 임대 시세가 어느 정도인지 문의드립니다.', at:`${ymd(addDays(t,-14))} 14:02`, via:'문자'},{dir:'in', text:'1층 40㎡대는 보증금 5천 / 월 290~310만원 선에서 거래됩니다.', at:`${ymd(addDays(t,-14))} 15:30`, via:'문자'}] },
    { id:'t3', kind:'tax', name:'송진석 세무사 (대한세무법인)', phone:'', contractId:'', messages:[{dir:'in', text:'7월 부가세 확정신고 자료 잘 받았습니다. 간주임대료 포함해서 신고 완료했습니다.', at:`${ymd(addDays(t,-35))} 17:05`, via:'이메일'}] }
  ];

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); return Object.assign(defaults(), o); } } catch(e){}
  return seedDemoRents(defaults());
}
let saveTimer=null;

  if (CAP.db && S.settings.cloudSync){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>cloudPush(), 800); }

}

}

/* ---------- 계산 유틸 ---------- */
const byId = id => S.contracts.find(c => c.id === id);
function dueDate(c, ym){ const [y,m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return new Date(y, m-1, Math.min(c.payDay||1, last)); }
function monthsOf(c, untilYM){
  const out=[]; let d = parseD(c.start.slice(0,7)+'-01'); const endYM = untilYM || Math.min(c.end.slice(0,7), ymOf(addMonths(today(),1)));
  while (ymOf(d) <= endYM){ out.push(ymOf(d)); d = addMonths(d,1); }
  return out;
}
function rentState(c, ym){
  const r = S.rents[`${c.id}_${ym}`] || {}; const due = dueDate(c, ym); const t = today();
  if (r.status === 'paid') return { code:'paid', label:'입금완료', cls:'ok', due, r };
  if (r.status === 'unpaid'){ const late = daysBetween(due, t); return { code:'unpaid', label: late>0?`미납 ${late}일`:'미입금', cls:'bad', due, r }; }
  if (ymd(due) === ymd(t)) return { code:'due', label:'오늘 납부일', cls:'warn', due, r };
  if (due < t) return { code:'check', label:'입금 확인 필요', cls:'warn', due, r };
  return { code:'upcoming', label:`${daysBetween(t,due)}일 후`, cls:'', due, r };
}
function active(c){ const t = ymd(today()); return c.start <= t && c.end >= t; }
function vatOf(c){ return c.vatSeparate && TAXABLE(c.type) ? Math.round(c.rent*0.1) : 0; }
/* 갱신·만료 관련 법정 기간 (상가: 만료 6개월~1개월 전 / 주택: 6개월~2개월 전) */
function renewalWindow(c){
  const end = parseD(c.end);
  const open = addMonths(end, -6); const close = addMonths(end, c.type==='house' ? -2 : -1);
  return { open, close, end, law: c.type==='house' ? '주택임대차보호법 §6①·§6의3①' : '상가건물 임대차보호법 §10①·④' };
}
/* 간주임대료 (부가가치세): 보증금 × 정기예금이자율 × 과세대상기간 일수 / 365 */
function periodOf(ym){ const [y,m] = ym.split('-').map(Number); return m<=6 ? {y, h:1, from:`${y}-01-01`, to:`${y}-06-30`, label:`${y}년 1기(1~6월)`, due:`${y}-07-25`} : {y, h:2, from:`${y}-07-01`, to:`${y}-12-31`, label:`${y}년 2기(7~12월)`, due:`${y+1}-01-25`}; }
function deemedRent(c, p){
  if (!TAXABLE(c.type)) return 0;
  const from = new Date(Math.max(parseD(c.start), parseD(p.from))); const to = new Date(Math.min(parseD(c.end), parseD(p.to)));
  if (to < from) return 0; const days = daysBetween(from, to) + 1; const yearDays = ((p.y%4===0&&p.y%100!==0)||p.y%400===0) ? 366 : 365;
  return Math.floor(c.deposit * (S.settings.deemedRate/100) * days / yearDays);
}
function periodMonths(p){ const out=[]; for(let m=(p.h===1?1:7); m<=(p.h===1?6:12); m++) out.push(`${p.y}-${pad(m)}`); return out; }
function vatEstimate(p){
  const rows = S.contracts.filter(c => TAXABLE(c.type)).map(c => {
    const months = periodMonths(p).filter(ym => ym >= c.start.slice(0,7) && ym <= c.end.slice(0,7));
    const supply = months.length * c.rent; const deemed = deemedRent(c, p);
    return { c, months: months.length, supply, deemed, vat: Math.round((supply+deemed)*0.1) };
  });
  const supply = rows.reduce((a,r)=>a+r.supply,0), deemed = rows.reduce((a,r)=>a+r.deemed,0);
  const simple = S.landlord.taxType === 'simple';
  // 간이과세자(부동산임대업 업종별 부가가치율 40%): 납부세액 = 공급대가 × 40% × 10%
  const outputVat = simple ? Math.round((supply+deemed) * 0.4 * 0.1) : Math.round((supply+deemed)*0.1);
  const inputVat = simple ? 0 : Number(S.settings.purchaseVat?.[`${p.y}-${p.h}`] || 0);
  return { rows, supply, deemed, outputVat, inputVat, payable: Math.max(0, outputVat - inputVat), simple };
}

/* ---------- 알림 엔진 (앱 실행 시 규칙 평가) ---------- */
function computeNotifications(){
  const t = today(); const list = []; const tYM = ymOf(t);
  S.contracts.filter(active).forEach(c => {
    monthsOf(c, tYM).slice(-3).forEach(ym => {
      const st = rentState(c, ym); const k = `${c.id}_${ym}`;
      if (st.code === 'due') list.push({ id:`due-${k}`, kind:'due', title:`${c.tenant} · 오늘 임대료 납부일`, body:`${c.name} · ${won(c.rent + vatOf(c))} 입금 여부를 확인해 주세요.`, cid:c.id, ym });
      else if (st.code === 'check') list.push({ id:`check-${k}`, kind:'due', title:`${c.tenant} · 입금 확인 필요`, body:`${fmtD(st.due)} 납부일이 지났습니다. 입금 여부를 체크해 주세요.`, cid:c.id, ym });
      else if (st.code === 'unpaid'){
        const ra = st.r.remindAt || ymd(t);
        if (ra <= ymd(t)) list.push({ id:`remind-${k}-${ra}`, kind:'bad', title:`${c.tenant} · 임대료 미입금 재확인`, body:`${fmtYM(ym)} 임대료 ${won(c.rent+vatOf(c))}가 아직 미입금입니다. 입금 확인 또는 임차인 안내를 진행하세요.`, cid:c.id, ym });
      }
    });
    // 만료 알림: D-180(갱신요구 가능기간 시작), D-90, 통지기한(상가 D-30/주택 D-60), D-7
    const dLeft = daysBetween(t, parseD(c.end)); const rw = renewalWindow(c);
    const marks = [ [180,'계약갱신 요구 가능기간 시작 6개월 전'], [90,'만료 3개월 전'], [c.type==='house'?60:30, `갱신거절·조건변경 통지기한 (${rw.law})`], [7,'만료 1주 전'] ];
    marks.forEach(([d,why]) => { if (dLeft <= d && dLeft > (d===180?90:d===90?(c.type==='house'?60:30):d===7?-1:7)) list.push({ id:`exp-${c.id}-${d}`, kind:'exp', title:`${c.name} · 만료 ${dLeft}일 전`, body:`${fmtD(c.end)} 만료 · ${why}. 재계약 여부를 임차인과 협의하거나 중개사무소에 연락하세요.`, cid:c.id }); });
    // 세금계산서: 전월분 미발급 → 다음 달 10일까지 발급 안내
    if (TAXABLE(c.type)){
      const prev = ymOf(addMonths(t,-1)); const k = `${c.id}_${prev}`;
      if (prev >= c.start.slice(0,7) && !(S.invoices[k]?.issued)) list.push({ id:`inv-${k}`, kind:'inv', title:`${c.tenantBizName||c.tenant} · ${fmtYM(prev)} 세금계산서 미발급`, body:`발급기한: ${fmtD(new Date(t.getFullYear(), t.getMonth(), 10))} (공급시기가 속한 달의 다음 달 10일)`, cid:c.id, ym: prev });
    }
  });
  // 병합: 기존 읽음 상태 유지, 해제된 알림 제외
  const prev = Object.fromEntries(S.notifications.map(n => [n.id, n]));
  const merged = list.filter(n => !S.dismissed[n.id]).map(n => Object.assign({ at: prev[n.id]?.at || nowStr(), read: prev[n.id]?.read || false }, n));
  const fresh = merged.filter(n => !prev[n.id]);
  S.notifications = merged; save();
  if (fresh.length && S.settings.notifyBrowser && 'Notification' in window && Notification.permission === 'granted'){
    fresh.slice(0,3).forEach(n => { try { new Notification('임대지기 · ' + n.title, { body: n.body }); } catch(e){} });
  }
  return merged;
}

/* ---------- 메시지 템플릿 (임대인 본인 명의 발송) ---------- */
function tplUnpaid(c, ym){
  const st = rentState(c, ym); const amt = c.rent + vatOf(c);
  return `[임대료 납부 안내]\n${c.tenant} 님, 안녕하세요. ${c.name} 임대인 ${S.landlord.name}입니다.\n${fmtYM(ym)} 임대료 ${won(amt)}${vatOf(c)?' (부가세 포함)':''}이 납부일(${fmtD(st.due)}) 기준 아직 확인되지 않았습니다.\n이미 이체하셨다면 이 문자는 무시하셔도 됩니다. 확인 부탁드리며, 사정이 있으시면 편하게 연락 주세요.\n감사합니다.`;
}
function tplExpiry(c){
  const rw = renewalWindow(c);
  return `[임대차계약 만료 안내]\n${c.tenant} 님, ${c.name} 임대인 ${S.landlord.name}입니다.\n현재 계약이 ${fmtD(c.end)}에 만료됩니다. 재계약(갱신) 의사가 있으신지 ${fmtD(rw.close)}까지 알려주시면 조건을 협의하여 진행하겠습니다.\n갱신을 원하지 않으시면 만료일에 맞춰 명도 및 보증금 반환 절차를 준비하겠습니다. 감사합니다.`;
}
function tplBroker(c){
  return `[임대 의뢰]\n안녕하세요, ${S.landlord.name}입니다. 아래 물건 임대차계약이 ${fmtD(c.end)} 만료 예정이어서 새 임차인 중개를 의뢰드립니다.\n- 물건: ${c.name} (${TYPES[c.type]}, ${c.area||'-'}㎡)\n- 소재지: ${c.addr}\n- 현재 조건: 보증금 ${manwon(c.deposit)} / 월 ${manwon(c.rent)}${c.vatSeparate?' (VAT 별도)':''}\n- 입주 가능일: ${fmtD(addDays(parseD(c.end),1))}\n연락 주시면 세부 조건 협의하겠습니다.`;

function tplQuote(c){

/* ---------- 홈 ---------- */

  S.contracts.forEach(c => monthsOf(c, tYM).forEach(ym => { if (ym.slice(0,4)===String(t.getFullYear()) && S.rents[`${c.id}_${ym}`]?.status==='paid') yearPaid += c.rent; }));

  <div class="card"><canvas class="chart" id="chart"></canvas><div class="legend"><span><i style="background:var(--line)"></i>예정</span><span><i style="background:var(--primary)"></i>입금</span><span><i style="background:var(--bad)"></i>미납</span></div><div class="grid3" id="chartSum" style="margin-top:10px"></div></div>

function seriesFor(mode){
  const t = today(); const out = [];
  if (mode==='month'){ for (let i=11;i>=0;i--){ const d = addMonths(t,-i); out.push({ label: `${d.getMonth()+1}월`, months:[ymOf(d)] }); } }
  else if (mode==='quarter'){ for (let i=7;i>=0;i--){ const q = Math.floor(t.getMonth()/3) - i; const y = t.getFullYear() + Math.floor(q/3); const qq = ((q%4)+4)%4; out.push({ label:`${String(y).slice(2)}'${qq+1}Q`, months:[0,1,2].map(m=>`${y}-${pad(qq*3+m+1)}`) }); } }
  else { for (let i=4;i>=0;i--){ const y = t.getFullYear()-i; out.push({ label:`${y}`, months:Array.from({length:12},(_,m)=>`${y}-${pad(m+1)}`) }); } }
  return out.map(b => { let planned=0, paid=0, unpaid=0; b.months.forEach(ym => S.contracts.forEach(c => { if (ym < c.start.slice(0,7) || ym > c.end.slice(0,7) || ym > ymOf(t)) return; planned += c.rent; const st = rentState(c, ym); if (st.code==='paid') paid += c.rent; else if (st.code==='unpaid') unpaid += c.rent; })); return Object.assign(b, {planned, paid, unpaid}); });
}
function drawChart(){
  const cv = $('#chart'); if (!cv) return; const data = seriesFor(ui.chartMode);
  const cs = getComputedStyle(document.documentElement); const col = n => cs.getPropertyValue(n).trim();
  const dpr = window.devicePixelRatio||1; const W = cv.clientWidth, H = 190; cv.width = W*dpr; cv.height = H*dpr; const g = cv.getContext('2d'); g.scale(dpr,dpr);
  const padL=44, padR=8, padT=10, padB=26; const max = Math.max(1, ...data.map(d=>d.planned)); const step = niceStep(max/4);
  const yMax = Math.ceil(max/step)*step; const x0=padL, x1=W-padR, y0=H-padB, y1=padT; const y = v => y0 - (v/yMax)*(y0-y1);
  g.font = '11px "IBM Plex Mono", monospace'; g.textBaseline='middle';
  for (let v=0; v<=yMax; v+=step){ g.strokeStyle = col('--line'); g.lineWidth=1; g.beginPath(); g.moveTo(x0, y(v)); g.lineTo(x1, y(v)); g.stroke(); g.fillStyle = col('--faint'); g.textAlign='right'; g.fillText(v>=1e8?(v/1e8).toFixed(1)+'억':Math.round(v/1e4)+'만', x0-6, y(v)); }
  const n = data.length; const bw = (x1-x0)/n; const bar = Math.min(28, bw*0.56);
  data.forEach((d,i) => { const cx = x0 + bw*i + bw/2; const bx = cx - bar/2;
    g.fillStyle = col('--line'); g.fillRect(bx, y(d.planned), bar, y0-y(d.planned));
    g.fillStyle = col('--primary'); g.fillRect(bx, y(d.paid), bar, y0-y(d.paid));
    if (d.unpaid){ g.fillStyle = col('--bad'); g.fillRect(bx, y(d.paid+d.unpaid), bar, y(d.paid)-y(d.paid+d.unpaid)); }
    g.fillStyle = col('--muted'); g.textAlign='center'; g.font = '11px "IBM Plex Sans KR", sans-serif'; if (n<=8 || i%2===(n-1)%2) g.fillText(d.label, cx, y0+13); });
  const tot = data.reduce((a,d)=>({planned:a.planned+d.planned, paid:a.paid+d.paid, unpaid:a.unpaid+d.unpaid}),{planned:0,paid:0,unpaid:0});
  $('#chartSum').innerHTML = `<div class="mini"><div class="l">기간 예정 합계</div><div class="v num">${manwon(tot.planned)}</div></div><div class="mini"><div class="l">누적 입금</div><div class="v num" style="color:var(--ok)">${manwon(tot.paid)}</div></div><div class="mini"><div class="l">수납률</div><div class="v num">${tot.planned?Math.round(tot.paid/tot.planned*100):0}%</div></div>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const r = x/p; return (r<=1?1:r<=2?2:r<=5?5:10)*p; }

/* ---------- 계약서 사진 촬영·보관 ---------- */
let PH = []; // 등록 진행 중인 사진(dataURL)
async function compressImage(file, max=1400, q=0.78){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('이미지를 열 수 없습니다')); i.src = url; });
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files, after){
  const list = [...(files||[])].filter(f => f && f.type.startsWith('image/'));
  if (!list.length) return;
  const st = $('#aiStatus'); if (st) st.innerHTML = '<span class="spin"></span> 사진을 정리하고 있습니다…';
  for (const f of list){ try { PH.push(await compressImage(f)); } catch(e){ toast(e.message); } }
  if (PH.length > 6) { PH = PH.slice(0, 6); toast('사진은 최대 6장까지 보관됩니다'); }
  if (st) st.innerHTML = '';
  if (after) after(); else renderPhotoStrip();
}
function photoStrip(list, removable){

<script>

async function sendTo(to, cid, text, how){

    <div class="btns"><button class="btn p" onclick="makeShare('file')">공유 파일 만들기 (JSON+CSV)</button><button class="btn" onclick="makeShare('mail')">이메일로 보내기</button></div>
  </div>
  <h2 class="sec">신고 일정</h2>
  <div class="card" style="font-size:13.5px">
    <div class="check"><div class="m ok">1</div><div><b>부가가치세 확정신고</b> 1기: 7월 25일 · 2기: 다음 해 1월 25일 (일반과세자). 간이과세자는 다음 해 1월 25일 연 1회.</div></div>
    <div class="check"><div class="m ok">2</div><div><b>사업장현황신고</b> (주택임대 등 면세사업자) 다음 해 2월 10일까지.</div></div>
    <div class="check"><div class="m ok">3</div><div><b>종합소득세</b> 5월 1일~31일 (성실신고확인대상자는 6월 30일). 주택임대소득 2천만원 이하는 분리과세 선택 가능.</div></div>
  </div>`;
}
async function makeShare(how){
  if (!$('#s_ok').checked) return toast('자료 제공 동의에 체크해 주세요');
  S.taxAgent.shared = true; S.taxAgent.sharedAt = ymd(today()); save();
  const pkg = { generatedAt: nowStr(), app:'임대지기', landlord: S.landlord, taxAgent: {name:S.taxAgent.name, office:S.taxAgent.office},
    contracts: $('#s_c').checked ? S.contracts.map(c=>({...c, review:undefined})) : undefined,
    rents: $('#s_r').checked ? Object.entries(S.rents).map(([k,r])=>{ const [cid,ym]=k.split('_'); const c=byId(cid); return { contract:c?.name, tenant:c?.tenant, month:ym, due: c?ymd(dueDate(c,ym)):'', status:r.status, paidAt:r.paidAt||'', amount:c?.rent }; }).sort((a,b)=>a.month.localeCompare(b.month)) : undefined,
    invoices: $('#s_i').checked ? Object.entries(S.invoices).map(([k,i])=>{ const [cid,ym]=k.split('_'); const c=byId(cid); return { contract:c?.name, buyer:c?.tenantBizName||c?.tenant, buyerBizNo:c?.tenantBiz, month:ym, supply:c?.rent, vat:Math.round((c?.rent||0)*0.1), issued:i.issued, no:i.no||'', issuedAt:i.issuedAt||'' }; }) : undefined,
    deemedRent: $('#s_i').checked ? [periodOf(ymOf(addMonths(today(),-6))), periodOf(ymOf(today()))].map(p=>({ period:p.label, rate:S.settings.deemedRate, rows:S.contracts.filter(c=>TAXABLE(c.type)).map(c=>({contract:c.name, deposit:c.deposit, deemed:deemedRent(c,p)})) })) : undefined,
    vat: $('#s_v').checked ? (()=>{ const p=periodOf(ymOf(today())); const e=vatEstimate(p); return { period:p.label, supply:e.supply, deemed:e.deemed, outputVat:e.outputVat, inputVat:e.inputVat, payable:e.payable, taxType:S.landlord.taxType }; })() : undefined };
  if (how==='mail'){ const body = tplTax() + '\n\n(첨부: 임대지기 공유 파일)'; location.href = `mailto:${encodeURIComponent(S.taxAgent.email||'')}?subject=${encodeURIComponent(`[임대지기] ${S.landlord.name} 임대현황 자료 ${ymd(today())}`)}&body=${encodeURIComponent(body)}`; threadFor('tax').messages.push({dir:'out', text: body, at: nowStr(), via:'이메일'}); save(); toast('이메일 앱을 열었습니다. 공유 파일을 첨부하세요.'); return; }
  const rentsCsv = pkg.rents ? csvOf(pkg.rents.map(r=>[r.contract,r.tenant,r.month,r.due,r.status,r.paidAt,r.amount]), ['물건','임차인','귀속월','납부일','상태','입금일','임대료']) : null;
  await saveFile(`임대현황_${S.landlord.name}_${ymd(today())}.json`, JSON.stringify(pkg, null, 2), '세무사 사무실 프로그램에 불러올 수 있는 구조화 자료입니다.');
  if (rentsCsv) setTimeout(()=>saveFile(`임대료수납_${ymd(today())}.csv`, rentsCsv), 600);
}

  <details class="acc"><summary>데이터 · 동기화</summary>
    ${USER ? `<div class="meta" style="padding:6px 0">계정 <b>${esc(USER.email||USER.user_metadata?.name||'')}</b> · 회사 서버(서울) 자동 저장 <span class="syncdot ${SYNC.state}"></span> ${SYNC.at?('마지막 저장 '+SYNC.at.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})):''}</div><div class="btns"><button class="btn" type="button" onclick="syncPush(true)">지금 저장</button><button class="btn" type="button" onclick="authSignOut()">로그아웃</button></div>` : `<label class="tw" style="display:flex;padding:8px 0"><input type="checkbox" id="t_cloud" ${T.cloudSync?'checked':''} ${CAP.db?'':'disabled'}> 클라우드 동기화 ${CAP.db?'(이 조직 내 기기 간 공유)':'(로그인 뷰어에서만 가능)'}</label>`}

function saveSettings(){ const g = id => $('#'+id).value.trim();
  Object.assign(S.landlord, { name:g('l_name'), phone:g('l_phone'), bizName:g('l_bizName'), bizNo:g('l_bizNo'), addr:g('l_addr'), email:g('l_email') });
  if (SB && USER) SB.from('profiles').upsert({ id: USER.id, name: S.landlord.name, phone: S.landlord.phone }).then(()=>{}, e=>console.warn('profile', e));
  Object.assign(S.taxAgent, { name:g('a_name'), office:g('a_office'), email:g('a_email'), phone:g('a_phone') });
  Object.assign(S.broker, { office:g('b_office'), name:g('b_name'), phone:g('b_phone') });
  S.settings.remindDays = Number(g('t_remind')||3); S.settings.deemedRate = Number(g('t_rate')||3.1); if ($('#t_cloud')) S.settings.cloudSync = $('#t_cloud').checked;
  save(); closeSheet(); render(); toast('설정을 저장했습니다'); }
function restoreFile(f){ if(!f) return; const r = new FileReader(); r.onload = () => { try { S = Object.assign(defaults(), JSON.parse(r.result)); save(); closeSheet(); render(); toast('복원했습니다'); } catch(e){ toast('파일을 읽을 수 없습니다'); } }; r.readAsText(f); }

/* ---------- 공통 UI ---------- */
function sheet(html){ $('#sheet').innerHTML = `<div class="grip"></div>${html}`; $('#modal').classList.add('open'); }
function closeSheet(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeSheet(); });
let toastT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2400); }
function go(tab){ ui.tab = tab; ui.detail = null; ui.thread = null; render(); }
$$('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

$('#gearBtn').onclick = () => openSettings();
window.addEventListener('resize', () => { if ($('#chart')) drawChart(); });


/* ---------- 로그인 · 회사 서버 저장 (Supabase) ---------- */
const SUPABASE_URL = 'https://lezpolceeqhdsgekidzi.supabase.co';
const SUPABASE_ANON_KEY = '';                       // 운영자 1회 입력: Supabase → Project Settings → API Keys (publishable/anon)
const AUTH_PROVIDERS = { email: true, kakao: false }; // 카카오 준비되면 kakao: true
let SB = null, USER = null, SYNC = { state:'', at:null, pushing:false };
const PHOTO_URL_CACHE = {};

function authAvailable(){ return !!(SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient); }
function showLogin(on){ const el = $('#login'); if (!el) return; el.classList.toggle('open', !!on); $('#app').style.visibility = on ? 'hidden' : ''; if (on){ $('#loginKakao').hidden = !AUTH_PROVIDERS.kakao; } }
function loginMsg(t, ok){ const m = $('#loginMsg'); if (m){ m.textContent = t || ''; m.style.color = ok ? 'var(--ok)' : 'var(--bad)'; } }
async function authEmail(mode){
  const email = $('#l_email').value.trim(), pw = $('#l_pw').value;
  if (!email || pw.length < 6) return loginMsg('이메일과 6자 이상 비밀번호를 입력하세요');
  loginMsg('잠시만…', true);
  try {
    if (mode === 'up'){
      const { data, error } = await SB.auth.signUp({ email, password: pw });
      if (error) throw error;
      if (!data.session) return loginMsg('가입 확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인하세요', true);
    } else {
      const { error } = await SB.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    }
  } catch(e){ loginMsg(/Invalid login/i.test(e.message) ? '이메일 또는 비밀번호가 맞지 않습니다' : /already registered/i.test(e.message) ? '이미 가입된 이메일입니다. 로그인해 주세요' : (e.message || '로그인 실패')); }
}
async function authKakao(){
  try { const { error } = await SB.auth.signInWithOAuth({ provider:'kakao', options:{ redirectTo: location.origin + location.pathname } }); if (error) throw error; }
  catch(e){ loginMsg(e.message || '카카오 로그인 실패'); }
}
async function authSignOut(){ if (!SB) return; await syncPush(true); await SB.auth.signOut(); USER = null; localStorage.removeItem(KEY); S = load(); closeSheet(); render(); showLogin(true); }

async function onSignedIn(user){
  USER = user; showLogin(false);
  // 다른 계정의 로컬 데이터는 섞지 않음
  if (S._owner && S._owner !== user.id){ S = seedDemoRents(defaults()); }
  S._owner = user.id;
  await syncPull();
  render();
}
async function syncPull(){
  try {
    SYNC.state = 'busy';
    const { data, error } = await SB.from('app_state').select('data, updated_at').eq('user_id', USER.id).maybeSingle();
    if (error) throw error;
    if (data && data.data && Object.keys(data.data).length){
      const serverAt = new Date(data.updated_at).getTime(), localAt = S._syncedAt || 0;
      if (serverAt >= localAt || !S._syncedAt){ S = Object.assign(defaults(), data.data, { _owner: USER.id }); }
      S._syncedAt = Math.max(serverAt, localAt); localStorage.setItem(KEY, JSON.stringify(S));
      if (serverAt < localAt) await syncPush(true);   // 로컬이 더 최신이면 올림
      SYNC.state = 'ok'; SYNC.at = new Date();
    } else { await syncPush(true); }
  } catch(e){ console.warn('sync pull', e); SYNC.state = 'err'; toast('서버와 동기화하지 못했습니다. 이 기기에는 저장됩니다'); }
}
async function syncPush(now){
  if (!SB || !USER || SYNC.pushing) return;
  SYNC.pushing = true; SYNC.state = 'busy';
  try {
    const payload = JSON.parse(JSON.stringify(S));
    // 아직 업로드되지 않은 사진(dataURL)은 서버 JSON에서 제외 (Storage 업로드 후 경로로 대체됨)
    (payload.contracts||[]).forEach(c => { if (Array.isArray(c.photos)) c.photos = c.photos.filter(u => typeof u === 'string' && u.startsWith('sb:')); });
    delete payload._syncedAt;
    const { data, error } = await SB.from('app_state').upsert({ user_id: USER.id, data: payload, device: navigator.userAgent.slice(0,80) }, { onConflict:'user_id' }).select('updated_at').single();
    if (error) throw error;
    S._syncedAt = new Date(data.updated_at).getTime(); localStorage.setItem(KEY, JSON.stringify(S));
    SYNC.state = 'ok'; SYNC.at = new Date();
  } catch(e){ console.warn('sync push', e); SYNC.state = 'err'; if (now) toast('서버 저장 실패: ' + (e.message||'')); }
  finally { SYNC.pushing = false; }
}
/* 계약서 사진: dataURL → Storage 업로드 → 'sb:<path>' 로 교체 */
async function persistPhotos(c){
  if (!SB || !USER || !c || !Array.isArray(c.photos)) return;
  let changed = false;
  for (let i = 0; i < c.photos.length; i++){
    const u = c.photos[i]; if (typeof u !== 'string' || !u.startsWith('data:')) continue;
    try {
      const blob = await (await fetch(u)).blob();
      const path = `${USER.id}/${c.id}/${Date.now()}_${i}.jpg`;
      const { error } = await SB.storage.from('contract-photos').upload(path, blob, { contentType:'image/jpeg', upsert:false });
      if (error) throw error;
      c.photos[i] = 'sb:' + path; PHOTO_URL_CACHE[path] = u; changed = true;
    } catch(e){ console.warn('photo upload', e); }
  }
  if (changed){ save(); if (ui.detail === c.id) render(); }
}
async function photoUrl(path){
  if (PHOTO_URL_CACHE[path]) return PHOTO_URL_CACHE[path];
  if (!SB) return '';
  const { data, error } = await SB.storage.from('contract-photos').createSignedUrl(path, 3600);
  if (error) { console.warn('signed url', error); return ''; }
  PHOTO_URL_CACHE[path] = data.signedUrl; return data.signedUrl;
}
async function hydratePhotos(){
  for (const img of $$('img[data-sb]')){ const path = img.dataset.sb; delete img.dataset.sb; const url = await photoUrl(path); if (url) img.src = url; }
}
async function initAuth(){
  if (!authAvailable()) return false;            // 키 미설정: 기존처럼 기기 저장만 (개발 모드)
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data:{ session } } = await SB.auth.getSession();
  if (session) await onSignedIn(session.user); else showLogin(true);
  SB.auth.onAuthStateChange((ev, sess) => {
    if (ev === 'SIGNED_IN' && sess && (!USER || USER.id !== sess.user.id)) onSignedIn(sess.user);
    if (ev === 'SIGNED_OUT'){ USER = null; showLogin(true); }
  });
  return true;
}

/* ---------- 런타임 능력 (claude.ai 뷰어) ---------- */
(async () => {
  render();
  try { await initAuth(); } catch(e){ console.warn('auth init', e); }
  if (!window.claude || !window.claude.use) return;
  try { CAP.sample = await claude.use('sample'); if (CAP.sample){ try { const lim = await CAP.sample.limits(); CAP.images = !!lim?.images; } catch(e){} } } catch(e){}
  try { CAP.downloads = await claude.use('downloads'); } catch(e){}
  try { CAP.db = await claude.use('db'); if (CAP.db && S.settings.cloudSync) cloudPull(); } catch(e){}
})();
